name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Bump occasionally to pull in rustfmt/rustdoc improvements; keep within a few months.
  NIGHTLY: nightly-2026-04-15
  # risc0 commit to build cargo-risczero from: "Fix cargo risczero guest test" (the release-3.0
  # backport of risc0/risc0#3592, closed PR risc0/risc0#3713). Upstream deleted the branch, so it
  # is fetched from the victor/feb12-af1f67c8 branch of the Wollac/risc0 fork.
  CARGO_RISCZERO_GIT: https://github.com/Wollac/risc0.git
  CARGO_RISCZERO_REV: 2d184364731643279835f281d9244a15c7149a06
  # rzup component versions. r0vm must match the minor version of risc0-zkvm in bench/Cargo.lock,
  # and a different guest toolchain changes the benchmark numbers.
  RISC0_RUST: 1.97.0
  R0VM: 3.0.6

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - run: cargo +${{ env.NIGHTLY }} fmt --all -- --check

  sort:
    name: Cargo Sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-sort
          version: "2.1"
      - run: cargo sort --workspace --grouped --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - run: cargo doc --workspace --lib --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  doctest:
    name: Doc Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - run: cargo test --doc --workspace

  docs-rs:
    name: docs.rs simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: ${{ env.NIGHTLY }}
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-docs-rs
          version: "1.0"
      - run: cargo +${{ env.NIGHTLY }} docs-rs -p risc0-crypto
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo +${{ env.NIGHTLY }} docs-rs -p risc0-crypto-evm
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Guest Test
    runs-on: ubuntu-latest
    # building cargo-risczero on a cache miss takes about 30 minutes
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable

      - name: Install rzup
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - name: Install risc0 toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rzup install rust ${{ env.RISC0_RUST }}

      - name: Cache cargo-risczero
        id: cache-risczero
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-risczero
          key: cargo-risczero-${{ env.CARGO_RISCZERO_REV }}

      # `cargo risczero guest test` needs the `experimental` feature, which the released binaries
      # are built without. Guest tests execute in-process, so skip the default `r0vm` feature (saves
      # ~8 minutes) and install only the `cargo-risczero` binary, not the package's `r0vm` target.
      - name: Install cargo-risczero from source
        if: steps.cache-risczero.outputs.cache-hit != 'true'
        run: >
          cargo install cargo-risczero
          --git ${{ env.CARGO_RISCZERO_GIT }}
          --rev ${{ env.CARGO_RISCZERO_REV }}
          --no-default-features
          --features experimental
          --bin cargo-risczero
          --force

      - name: Run guest tests
        run: cargo risczero guest test

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable

      - name: Install rzup
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - name: Install risc0 toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rzup install rust ${{ env.RISC0_RUST }}
          rzup install r0vm ${{ env.R0VM }}

      - name: Run benchmarks
        run: >
          cargo run --release --locked
          --manifest-path bench/Cargo.toml
          -- --json bench-results.json

      - name: Track benchmark results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: risc0-crypto benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: "101%"
          fail-on-alert: true
          comment-on-alert: true
          comment-always: ${{ github.event_name == 'pull_request' }}
          summary-always: true
