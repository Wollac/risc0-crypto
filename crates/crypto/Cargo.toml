[package]
name = "risc0-crypto"
description = "zkVM-only: cryptographic primitives built on risc0-bigint2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition", "--cfg=docsrs"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
educe = "0.6"
include_bytes_aligned = "0.2"
risc0-bigint2 = "1.4.13"

[build-dependencies]
cargo_metadata = "0.23.1"

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
sha2 = { version = "0.10", default-features = false }
wycheproof = { version = "0.6", default-features = false, features = ["ecdh", "ecdsa"] }

[lints]
workspace = true
