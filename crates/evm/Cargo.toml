[package]
name = "risc0-crypto-evm"
description = "zkVM-only: EVM precompile primitives backed by risc0-crypto - BN254 G1, P-256 verify, ecrecover, modexp, SHA-256"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition", "--cfg=docsrs"]

[dependencies]
alloy-primitives = { version = "1.5", default-features = false, features = ["map"] }
risc0-crypto = { version = "0.1", path = "../crypto" }
risc0-zkp = { version = "3.0.4", default-features = false }

[dev-dependencies]
# `cargo risczero guest test` builds the integration tests for the zkVM
# target. `getrandom` 0.2 needs the `custom` feature to compile there.
getrandom = { version = "0.2", features = ["custom"] }
num-bigint = { version = "0.4", default-features = false }
rstest = { version = "0.26", default-features = false }

[lints]
workspace = true
